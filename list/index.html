<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noarchive">
  <!-- OpenGraph metadata (https://ogp.me) -->
  <meta property="og:title" content="ClutterGDPS Demonlist">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cluttergdps.vercel.app/list/">
  <meta property="og:description" content="The official demonlist for ClutterGDPS.">
  <meta property="og:determiner" content="the">
  <meta property="og:locale" content="en_GB">
  <meta property="og:site_name" content="ClutterGDPS">
  <title>ClutterGDPS Demonlist</title>

  <style>
    /* Don't worry about this. It becomes visible again near the end of the body tag.
      This is just here to stop a flash of unstyled content. */
    html {visibility: hidden; opacity: 0;}
  </style>
  <link rel="stylesheet" href="/list/style.css" type="text/css">
  <link rel="icon" href="/favicon.png" type="image/png">
  <script src="/list/script.js" type="module" defer></script>
</head>
<body>
  <div class="header">
    <b class="logo">ClutterGDPS Demonlist</b>
    <a href="/list" class="hlink">List</a>
    <a href="/list/leaderboard" class="hlink">Leaderboard</a>
    <a href="/list/rules" class="hlink">Rules</a>
  </div>
  <div class="main">
    <div id="list">
      <input id="search" placeholder="Search for a level..."></input>
      <p id="empty" style="display: none;" class="sad"><i>Nothing was found...</i></p>
    </div>
    <div id="level"></div>
  </div>
  <style>
    /* Become visible now that the page's loaded (this will always be the last thing to load) */
    html {visibility: visible; opacity: 1;}
  </style>
</body>
</html>
